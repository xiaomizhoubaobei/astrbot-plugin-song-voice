repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-yaml
  - id: check-json
  - id: check-toml
  - id: check-added-large-files
    args: ['--maxkb=10000']
  - id: detect-private-key
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: mixed-line-ending
    args: ['--fix=lf']
- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 26.10.1
  hooks:
  - id: black
    # 不绑定 language_version：仅要求本机具备任意受支持的 Python，跨版本可跑通
    args: ['--target-version', 'py312']
- repo: https://github.com/pycqa/flake8
  rev: 7.4.1
  hooks:
  - id: flake8
    args: ['--max-line-length=100', '--extend-ignore=E203,W503']
- repo: https://github.com/pycqa/isort
  rev: 10.0.0b1
  hooks:
  - id: isort
    # isort 10+ 要求 Python >= 3.11；显式钉到 3.12，避免 CI 默认解释器（3.10）装不上该钩子
    language_version: python3.12
    args: ['--profile', 'black']
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.4.0
  hooks:
  - id: mypy
    additional_dependencies: [types-aiofiles]
    args: ['--ignore-missing-imports']
- repo: https://github.com/pycqa/pydocstyle
  rev: 6.3.0
  hooks:
  - id: pydocstyle
    # AstrBot 插件目录按平铺 .py 分发，本就没有包级文档；D415 与中文句子里的「。」冲突。
    # 故放开缺失类（D1xx）与 D415，仅保留声明写法类规则。
    args:
      - '--convention=google'
      - '--add-ignore=D101,D102,D103,D104,D105,D107,D415'
