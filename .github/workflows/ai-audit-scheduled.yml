# =============================================================================
# AI 审计（告警分流）— CodeQL 完成后自动运行
# =============================================================================
# ⚠️ 【与上游 astrbot_plugin_models_ai 的差异，请先读】
#   上游本工作流依赖仓库内的 ai-audit/（taskflow + personality + 公钥）与
#   seclab-taskflow-agent 框架，跑一次要十几分钟核时，还要求配齐 5 个 Secret
#   （AI_API_ENDPOINT / AI_API_TOKEN / AI_MODEL_NAME / GH_PAT /
#   AUDIT_HANDOFF_PRIVATE_KEY）与一个受保护 environment。
#   本仓库**没有 ai-audit/ 目录**，也没有上述 Secrets，直接照搬只会得到一条
#   「CodeQL 跑完 → AI 审计红」的永久失败工作流。
#   故此处只同步其**安全骨架**（令牌隔离 + 幂等发文 + 协调披露），
#   把「AI 判定」换成**确定性规则**：
#
#     ① triage  job：只读。拉取 CodeQL 告警，按严重级别 / 安全等级 / 规则做
#        确定性分流，产出纯数据 artifact（**不含令牌、不含可执行产物**）。
#     ② publish job：唯一持 GH_PAT 的 job，**不检出任何仓库源码**，只消费
#        artifact 里的 JSON；建公开占位 Issue（脱敏），细节留在告警本体里。
#
#   等将来补齐 ai-audit/ 与 Secrets，再把上游版本整体搬过来即可——
#   隔离墙的形状保持不变，替换的只是 triage 内部那一段。
#
# 所需 Secrets（缺省时工作流安全跳过，不判红）：
#   - GH_PAT 可选：具备 issues:write 的 PAT。**未配置则整条发布链跳过**，
#     只跑 triage 并把分流结果留作 artifact，不会误报失败。
#
# ⚠️ 协调披露：公开 Issue 只写告警编号与严重级别，**不含**规则名 / 文件路径 /
#    PoC 细节——那些留在 Code Scanning 与仓库安全面板里，修复前不外泄。
# =============================================================================

name: "AI 审计（CodeQL 完成后自动分流）"

on:
  workflow_run:
    # 监听 CodeQL.yml 的 workflow 名（.github/workflows/CodeQL.yml 的 name）
    workflows: ["代码质量分析"]
    types: [completed]
  workflow_dispatch:  # 保留手动触发，便于首次部署验证链路

permissions:
  # 顶层默认最小权限：本工作流不依赖 GITHUB_TOKEN 的写能力（建 Issue 走 GH_PAT，
  # 且只在 publish job 内注入），故全局只保留只读 contents。
  contents: read

# ── 并发串行化（防重复 Issue 的第一道闸） ────────────────────────────────────
# workflow_run 由「CodeQL 完成」驱动，而 CodeQL 在 push / PR / schedule 多个入口
# 下可能**短时间内并发完成**，同时拉起本工作流实例；两个 publish 会同时走到
# 「先查是否存在、再创建」的判定点，双双读到「不存在」→ 同一告警被建成两条 Issue。
# 对策：收敛到同一 concurrency group 并排队（cancel-in-progress: false），
#       保证任一时刻只有一个 publish 在跑。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  # ⚠️ 仅设 cancel-in-progress: false 也够用：GitHub 对 concurrency 默认「同组排队」，
  #    后到实例等前一个跑完再开始。上游仓库还加了 `queue: max`（保留全部 pending），
  #    但那属平台新特性，非所有环境都认，写进来会让工作流直接解析失败，故不采用。

jobs:
  # ---------------------------------------------------------------------------
  # Job 1：分流（无仓库写凭据、不接触 GH_PAT）
  # ---------------------------------------------------------------------------
  triage:
    name: 告警分流（无仓库写凭据）
    runs-on: ubuntu-latest
    # 对外只暴露一个布尔：有没有东西要发。下游据此短路，不必自己去猜。
    outputs:
      has_verdicts: ${{ steps.triage.outputs.has_verdicts }}
    permissions:
      # 只读：足够读取 CodeQL 告警；本 job 不持有任何仓库写凭据。
      contents: read
      security-events: read
    # 门禁：
    #   1) 手动触发需落在**默认分支**上才放行；
    #   2) workflow_run 需上游 CodeQL 成功完成（避免过期扫描状态）；
    #   3) 【安全关键】上游运行的 head 仓库必须是本仓库：fork PR 触发的 CodeQL
    #      运行一律不进入本工作流，杜绝 PR 源码充当不可信输入。
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: 加固运行器（审计所有出站调用）
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # 本 job **不检出任何源码**：需要的只有 Code Scanning 的告警数据（纯 API 数据）。
      # 少一次检出就少一处「不可信输入进入高权限链」的可能。
      - name: 拉取 open 告警并按确定性规则分流
        id: triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERDICT_FILE: ${{ runner.temp }}/audit-verdicts.json
        run: |
          set -euo pipefail
          API="${GITHUB_API_URL:-https://api.github.com}"
          mkdir -p "$(dirname "$VERDICT_FILE")"
          : > "$VERDICT_FILE"
          PAGE=1
          TOTAL=0
          while : ; do
            # 只取 open 且未 dismissed 的告警；per_page 上限 100
            BODY_FILE="$(mktemp)"
            code="$(curl -sS -o "$BODY_FILE" -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/repos/${REPO}/code-scanning/alerts?state=open&per_page=100&page=${PAGE}")" || code=000
            if [ "$code" != "200" ]; then
              # Code Scanning 在仓库未启用 / 无权限时返回 403/404。
              # 这属**能力未开启**而非代码问题，故不判红：写空数组后正常收尾。
              echo "::notice::拉取告警返回 HTTP ${code}，可能未启用 Code Scanning 或令牌无 security-events 读权限；本次按「无告警」处理。"
              rm -f "$BODY_FILE"
              break
            fi
            jq -e 'type == "array"' "$BODY_FILE" >/dev/null \
              || { echo "::error::告警列表非 JSON 数组，拒绝继续"; rm -f "$BODY_FILE"; exit 1; }
            N="$(jq 'length' "$BODY_FILE")"
            if [ "$N" -eq 0 ]; then rm -f "$BODY_FILE"; break; fi

            # 确定性分流：
            #   · severity 为 error 且 security_severity 在 high/critical → PENDING_REVIEW
            #   · 其余（warning/note、或未定级）→ 不进结论，避免噪音刷屏
            # 只留结构化字段，且**不带 report 全文**：下游建的是公开 Issue。
            jq -c --arg repo "$REPO" '
              .[] |
              select((.rule.security_severity_level // "") | test("^(critical|high)$")) |
              select((.rule.severity // "") == "error") |
              {
                status: "PENDING_REVIEW",
                alert_number: (.number | tostring),
                rule: (.rule.id // .rule.description // ""),
                path: (.most_recent_instance.location.path // ""),
                severity: (.rule.severity // ""),
                security_severity: (.rule.security_severity_level // ""),
                html_url: (.html_url // ""),
                repo: $repo
              }' "$BODY_FILE" >> "$VERDICT_FILE"
            rm -f "$BODY_FILE"
            TOTAL=$((TOTAL + N))
            [ "$N" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done

          # 收口成合法 JSON 数组（逐行 JSON 用 slurp 合并），再做一次格式自检。
          if [ -s "$VERDICT_FILE" ]; then
            jq -s '.' "$VERDICT_FILE" > "${VERDICT_FILE}.arr" && mv "${VERDICT_FILE}.arr" "$VERDICT_FILE"
          else
            echo '[]' > "$VERDICT_FILE"
          fi
          jq -e 'type == "array"' "$VERDICT_FILE" >/dev/null \
            || { echo "::error::分流结论不是 JSON 数组"; exit 1; }
          echo "拉取告警 ${TOTAL} 条，其中需人工复核 $(jq 'length' "$VERDICT_FILE") 条"
          jq '.' "$VERDICT_FILE"
          # 显式外化「有没有东西要发」：publish 侧据此短路，不靠猜。
          if [ "$(jq 'length' "$VERDICT_FILE")" -gt 0 ]; then
            echo "has_verdicts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_verdicts=false" >> "$GITHUB_OUTPUT"
          fi

      # 上传的是**纯数据**（无令牌、无凭据、无可执行产物），下游只解析不执行。
      - name: 上传分流结论 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-verdicts
          path: ${{ runner.temp }}/audit-verdicts.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2：发布（唯一持有 GH_PAT 的 job）
  # ---------------------------------------------------------------------------
  publish:
    name: 创建 Issue（持令牌）
    needs: triage
    runs-on: ubuntu-latest
    # 仅当 triage 确有「需人工复核」的结论时才跑：
    # 空结论不该去撞 GH_PAT——首次部署没配 Secret 时，那条路会以「配置缺失」
    # 伪装成「链路故障」，把「无事可做」误报成「坏了」。
    # ⚠️ GitHub 不允许在 job 级 `if` 里引用 secrets，故「GH_PAT 是否配置」的判断
    # 放在 job 内的第一个 step（见下方发文步骤），不到位就安全跳过。
    if: needs.triage.result == 'success' && needs.triage.outputs.has_verdicts == 'true'
    permissions:
      # 仍保持最小权限：建 Issue 走 GH_PAT，不依赖 GITHUB_TOKEN 写能力
      contents: read
    steps:
      - name: 加固运行器（审计所有出站调用）
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # ⚠️ 本 job **不检出仓库源码**、不执行任何脚本：artifact 是纯数据，
      #    字段经 jq 白名单重建，结构上无法注入工作流或 shell。
      - name: 下载分流结论 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audit-verdicts
          path: ${{ runner.temp }}/audit

      - name: 按分流结论创建 Issue（幂等 + 并发自愈）
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "::notice::未配置 Secret GH_PAT，跳过发文（triage 结论仍可在 artifact 里查看）。"
            exit 0
          fi
          FILE="${RUNNER_TEMP}/audit/audit-verdicts.json"
          [ -f "$FILE" ] || { echo "无结论文件，跳过"; exit 0; }
          jq -e 'type == "array"' "$FILE" >/dev/null \
            || { echo "::error::结论文件不是 JSON 数组，拒绝发文"; exit 1; }

          API="${GITHUB_API_URL:-https://api.github.com}"
          AUTH_HEADER="Authorization: Bearer ${GH_PAT}"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          FINGERPRINT_PREFIX="<!-- ai-audit-alert:"

          # ── 告警来源校验（发文前的信任边界） ─────────────────────────────────
          # artifact 里的「需复核」标记不构成来源可信：建任何 GitHub 资源之前，
          # 用只读 Code Scanning API 回查 alert_number，并逐字段核对 rule / path。
          # 校验失败（含 API 报错）一律返回非 0，由调用方 abort，绝不「当作没问题放行」。
          verify_alert_provenance() {
            local alert="$1" rule="$2" path="$3" body ok
            case "$alert" in
              ''|*[!0-9]*) echo "告警编号非法（应为纯数字）：${alert}" >&2; return 1 ;;
            esac
            body="$(curl -fsSL -H "${AUTH_HEADER}" -H "${ACCEPT_HEADER}" \
              "${API}/repos/${REPO}/code-scanning/alerts/${alert}")" \
              || { echo "拉取权威告警 #${alert} 失败" >&2; return 1; }
            jq -e 'type == "object"' <<<"$body" >/dev/null \
              || { echo "权威告警 #${alert} 响应非 JSON 对象" >&2; return 1; }
            ok="$(jq -r --arg r "$rule" --arg p "$path" '
              ((.rule.id // .rule.description // "") == $r)
              and ((.most_recent_instance.location.path // "") == $p)
            ' <<<"$body")"
            [ "$ok" = "true" ] || {
              echo "权威告警 #${alert} 的 rule/path 与结论不一致，判定为非可信来源，跳过。" >&2
              return 1
            }
            return 0
          }

          # 是否存在「带该指纹」的 Issue：**须翻页遍历全部 open Issue**。
          # 只取首页会漏判：open Issue 超 100 条时，排在之后的既有 Issue 查不到
          # → 误判「不存在」→ 重复创建。
          find_issue_by_fingerprint() {
            local fp="$1" page=1 found="" batch n
            while : ; do
              batch="$(curl -fsSL -H "${AUTH_HEADER}" -H "${ACCEPT_HEADER}" \
                "${API}/repos/${REPO}/issues?state=open&per_page=100&page=${page}")" \
                || { echo "拉取 open Issue 第 ${page} 页失败" >&2; return 2; }
              jq -e 'type == "array"' <<<"$batch" >/dev/null \
                || { echo "open Issue 第 ${page} 页非 JSON 数组" >&2; return 2; }
              n="$(jq 'length' <<<"$batch")"
              [ "$n" -eq 0 ] && break
              # 只认 issue（PR 也会出现在 /issues 里，带 pull_request 字段）
              found="$(jq -r --arg fp "$fp" \
                '[.[] | select((.pull_request | not) and ((.body // "") | contains($fp)))]
                 | if length > 0 then (.[0].number | tostring) else "" end' <<<"$batch")"
              [ -n "$found" ] && { printf '%s' "$found"; return 0; }
              [ "$n" -lt 100 ] && break
              page=$((page + 1))
            done
            return 0
          }

          COUNT="$(jq '[.[] | select(.status=="PENDING_REVIEW")
                             | select((.alert_number//"")!="" and (.rule//"")!="" and (.path//"")!="")]
                        | length' "$FILE")"
          echo "待处理结论数：$COUNT"
          if [ "$COUNT" -eq 0 ]; then echo "无可发布结论，跳过"; exit 0; fi

          CREATED=0
          SKIPPED=0
          while IFS= read -r item; do
            RULE="$(jq -r '.rule' <<<"$item")"
            PATH_="$(jq -r '.path' <<<"$item")"
            ALERT="$(jq -r '.alert_number' <<<"$item")"
            SEV="$(jq -r '.security_severity // .severity // ""' <<<"$item")"
            URL="$(jq -r '.html_url // ""' <<<"$item")"

            # 公开标题**不含** rule/path（属可利用细节），仅以编号与级别区分
            TITLE="[安全告警] CodeQL #${ALERT}（${SEV}）"
            FINGERPRINT="${FINGERPRINT_PREFIX}${ALERT} -->"

            if ! verify_alert_provenance "$ALERT" "$RULE" "$PATH_"; then
              echo "跳过非可信来源的告警：#${ALERT}" >&2
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # 第一道去重（乐观预检）：命中即跳过，省下一次创建调用。
            # 注意：并发窗口下这一步只是「快速路径」，正确性由后续自愈兜底。
            if ! EXIST="$(find_issue_by_fingerprint "$FINGERPRINT")"; then
              echo "Issue 去重查询失败（告警 #${ALERT}），中止以避免重复创建。" >&2
              exit 1
            fi
            if [ -n "$EXIST" ]; then
              echo "已存在（#${EXIST}），跳过：$TITLE"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # 公开 Issue：仅脱敏占位，细节留在 Code Scanning（默认仅维护者可见）
            BODY="$(jq -n --arg a "$ALERT" --arg s "$SEV" --arg u "$URL" --arg fp "$FINGERPRINT" \
              '($fp + "\n> 由 AI 审计自动创建（CodeQL 告警分流）。\n\n"
                + "本 Issue 仅作**跟踪占位**：为遵守协调披露原则，"
                + "漏洞的可利用细节（规则、文件、PoC）**不在公开渠道披露**。\n\n"
                + "- 告警编号：" + $a + "\n"
                + "- 安全等级：" + $s + "\n"
                + (if $u == "" then "" else "- 告警详情（仅维护者可见）：" + $u + "\n" end)
                + "\n## 处置约定\n\n"
                + "- 详情请到仓库 Security → Code scanning 查看对应告警。\n"
                + "- 修复发布前，请勿在公开 Issue / PR / 讨论区披露漏洞细节。\n"
                + "- 修复完成后关闭本 Issue。")')"
            PAYLOAD="$(jq -n --arg t "$TITLE" --arg b "$BODY" \
              '{title:$t, body:$b, labels:["security","ai-audit"]}')"

            NEW_ID="$(curl -fsSL -X POST -H "${AUTH_HEADER}" -H "${ACCEPT_HEADER}" \
              "${API}/repos/${REPO}/issues" -d "$PAYLOAD" | jq -r '.number')"
            echo "已创建：#${NEW_ID} ${TITLE}"
            CREATED=$((CREATED + 1))

            # 创建后自愈（并发兜底）：若临界区里另一个实例抢先建了同一指纹的
            # Issue，此刻会存在 ≥2 条。按「保留编号最小（最早创建）」的确定性
            # 规则自我关闭本条，收敛到唯一一条 open Issue。
            if ! DUP_OF="$(find_issue_by_fingerprint "$FINGERPRINT")"; then
              echo "创建后自愈复查失败（告警 #${ALERT}），中止以避免残留重复。" >&2
              exit 1
            fi
            if [ -n "$DUP_OF" ] && [ "$DUP_OF" != "$NEW_ID" ] && [ "$DUP_OF" -lt "$NEW_ID" ]; then
              echo "检测到并发重复（保留 #${DUP_OF}），自我关闭 #${NEW_ID}" >&2
              curl -fsSL -X PATCH -H "${AUTH_HEADER}" -H "${ACCEPT_HEADER}" \
                "${API}/repos/${REPO}/issues/${NEW_ID}" \
                -d "$(jq -n --arg b "$(printf '%s\n\n%s' \
                  "> 本条为并发竞态产生的重复 Issue，已自动关闭。" \
                  "> 同一告警的正式跟踪 Issue：见 #${DUP_OF}。")" '{state:"closed", body:$b}')" \
                > /dev/null
              CREATED=$((CREATED - 1))
              SKIPPED=$((SKIPPED + 1))
            fi
          done < <(jq -c '.[] | select(.status=="PENDING_REVIEW")
                             | select((.alert_number//"")!="" and (.rule//"")!="" and (.path//"")!="")' "$FILE")

          echo "发布完成：新建 Issue ${CREATED} 条，跳过 ${SKIPPED} 条"
